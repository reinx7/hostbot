services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hostbot
      POSTGRES_PASSWORD: hostbot
      POSTGRES_DB: hostbot
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostbot"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./storage:/app/storage
  websocket:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: npm run ws
    env_file: .env
    ports: ["3001:3001"]
    depends_on: [postgres, redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./storage:/app/storage
  deploy-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: npm run worker:deploy
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./storage:/app/storage
volumes:
  postgres-data:
  redis-data:
networks:
  default:
    name: hostbot-runtime
